name: Release WinHubX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Project/WinHubX/WinHubX.csproj

      - name: Build release
        run: dotnet build Project/WinHubX/WinHubX.csproj --configuration Release --no-restore --nologo

      - name: Publish self-contained Win-x64 artifact
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $output = Join-Path $env:GITHUB_WORKSPACE "artifacts/WinHubX-$version-win-x64"
          dotnet publish Project/WinHubX/WinHubX.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $output `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            --nologo
          Compress-Archive -Path (Join-Path $output '*') -DestinationPath "$output.zip"
          $hash = (Get-FileHash "$output.zip" -Algorithm SHA256).Hash
          "sha256=$hash" | Set-Content "$output.sha256" -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.sha256
