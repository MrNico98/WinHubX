name: Problema o miglioramento documentazione
description: Segnala documentazione mancante, ambigua o non aggiornata.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Pagina o file interessato
      placeholder: README.md, FAQ, docs/wiki/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problema riscontrato
      description: Cita il passaggio e spiega perché non è chiaro o corretto.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Modifica proposta
    validations:
      required: false
